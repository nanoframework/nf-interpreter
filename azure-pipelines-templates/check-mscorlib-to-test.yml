steps:
  - task: PowerShell@2
    name: Check_mscorlib_test
    displayName: Check mscorlib to test
    condition: ne(variables['System.PullRequest.PullRequestId'], '')
    inputs:
      failOnStderr: false
      targetType: "inline"
      script: |

        $ErrorActionPreference = 'Stop'

        # compute authorization header in format "AUTHORIZATION: basic 'encoded token'"
        # 'encoded token' is the Base64 of the string "nfbot:personal-token"
        $auth = "basic $([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("nfbot:$(GitHubToken)")))"

        # find PR
        "Getting PR#$env:System_PullRequest_PullRequestNumber details..." | Write-Host -ForegroundColor White -NoNewline
        $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:Build_Repository_Name/pulls/$env:System_PullRequest_PullRequestNumber" -Header @{"Authorization"="$auth"} -ContentType "application/json" -Method GET

        # Example: [tested against nanoframework/CoreLibrary#123]
        $references = [regex]::Matches([string]$pr.body, '\[tested against nanoframework/CoreLibrary#(\d+)\]', 'IgnoreCase')
        if($references.Count -gt 1)
        {
          throw "Specify only one CoreLibrary PR reference."
        }

        if($references.Count -eq 1)
        {
          $testPR = $references[0].Groups[1].Value
          "Test PR found: $testPR" | Write-Host -ForegroundColor White

          # move to the build sources directory
          Set-Location -Path "$env:AGENT_BUILDDIRECTORY/s/CoreLibrary"

          # need to call this first to setup authentication
          gh auth setup-git
          if($LASTEXITCODE -ne 0)
          {
            throw "GitHub CLI authentication setup failed."
          }

          Write-Host "Checking out mscorlib PR: #$testPR"
          gh pr checkout $testPR --repo nanoframework/CoreLibrary

          if($LASTEXITCODE -ne 0)
          {
            throw "Could not check out CoreLibrary PR #$testPR."
          }
          
          # gh pr checkout doesn't move submodules: sync them to the PR's pointers (test framework / unit test launcher)
          git submodule update --init --recursive
        }
        else
        {
          "No test PR found. Using main branch" | Write-Host -ForegroundColor White
        }
    env:
      GITHUB_TOKEN: $(GitHubToken)
