steps:
  - task: PowerShell@2
    displayName: Check MDP for build
    condition: ne(variables['System.PullRequest.PullRequestId'], '')
    inputs:
      failOnStderr: false
      targetType: "inline"
      script: |

        $ErrorActionPreference = 'Stop'

        # compute authorization header in format "AUTHORIZATION: basic 'encoded token'"
        # 'encoded token' is the Base64 of the string "nfbot:personal-token"
        $auth = "basic $([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("nfbot:$(GitHubToken)")))"
        Write-Host "##vso[task.setvariable variable=MDP_BUILDID]"

        $pr = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:Build_Repository_Name/pulls/$env:System_PullRequest_PullRequestNumber" -Header @{"Authorization"="$auth"} -ContentType "application/json" -Method GET

        # Example: [tested against nanoframework/metadata-processor#123]
        $references = [regex]::Matches([string]$pr.body, '\[tested against nanoframework/metadata-processor#(\d+)\]', 'IgnoreCase')
        if($references.Count -gt 1)
        {
          throw "Specify only one metadata-processor PR reference."
        }

        if($references.Count -eq 1)
        {
          $testPR = $references[0].Groups[1].Value
          $dependencyPR = Invoke-RestMethod -Uri "https://api.github.com/repos/nanoframework/metadata-processor/pulls/$testPR" -Header @{"Authorization"="$auth"} -ContentType "application/json" -Method GET
          $headSha = $dependencyPR.head.sha
          if([string]::IsNullOrWhiteSpace($headSha))
          {
            throw "Could not resolve the head commit of metadata-processor PR #$testPR."
          }

          Write-Host "Finding a completed MDP build for PR #$testPR at $headSha"
          $buildApi = 'https://dev.azure.com/nanoframework/metadata-processor/_apis/build'
          $branch = [uri]::EscapeDataString("refs/pull/$testPR/merge")
          $buildsUri = "$buildApi/builds?definitions=43&repositoryId=nanoframework%2Fmetadata-processor" +
            "&repositoryType=GitHub&branchName=$branch&statusFilter=completed&resultFilter=succeeded,failed" +
            '&queryOrder=queueTimeDescending&$top=100&api-version=7.1'
          $continuationToken = $null
          $selectedBuild = $null

          do
          {
            $pageUri = $buildsUri
            if($continuationToken)
            {
              $pageUri += "&continuationToken=$([uri]::EscapeDataString($continuationToken))"
            }

            $response = Invoke-WebRequest -Uri $pageUri -UseBasicParsing -Method GET
            $builds = $response.Content | ConvertFrom-Json
            $selectedBuild = $builds.value | Where-Object {
              $_.status -eq 'completed' -and $_.result -in @('succeeded', 'failed') -and
              $_.triggerInfo.'pr.number' -eq $testPR -and
              $_.triggerInfo.'pr.sourceSha' -eq $headSha
            } | Select-Object -First 1
            $continuationToken = [string]($response.Headers['x-ms-continuationtoken'] | Select-Object -First 1)
          } while(!$selectedBuild -and $continuationToken)

          if(!$selectedBuild)
          {
            throw "No eligible completed MDP build found for PR #$testPR at $headSha. Run the dependency pipeline, then retry."
          }

          $buildId = $selectedBuild.id
          $artifacts = Invoke-RestMethod -Uri "$buildApi/builds/$buildId/artifacts?api-version=7.1" -Method GET
          if(!($artifacts.value | Where-Object { $_.name -eq 'deployables' -and $_.resource.type -eq 'PipelineArtifact' }))
          {
            throw "MDP build $buildId has no deployables pipeline artifact."
          }

          Write-Host "Using MDP build ${buildId}: https://dev.azure.com/nanoframework/metadata-processor/_build/results?buildId=$buildId"
          Write-Host "##vso[task.setvariable variable=MDP_BUILDID]$buildId"
        }
        else
        {
          Write-Host "No metadata-processor PR reference found. Stick with default from msbuild components."
        }
    env:
      GITHUB_TOKEN: $(GitHubToken)

  - task: DownloadPipelineArtifact@2
    condition: and(succeeded(), ne(variables['MDP_BUILDID'], ''))
    displayName: Download MDP
    inputs:
      buildType: specific
      project: 'metadata-processor'
      definition: '43'
      buildVersionToDownload: specific
      allowFailedBuilds: true
      pipelineId: $(MDP_BUILDID)
      artifactName: 'deployables'
      targetPath: '$(Pipeline.Workspace)/mdp'
      itemPattern: '*.MsBuildTask.dll'

  - task: PowerShell@2
    condition: >-
      and(
        succeeded(),
        ne(variables['MDP_BUILDID'], '')
      )
    displayName: Copy MDP to build tool
    inputs:
      targetType: 'inline'
      script: |
        # Find which VS version is installed
        $VsWherePath = "${env:PROGRAMFILES(X86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        Write-Output "VsWherePath is: $VsWherePath"

        $VsInstance = & $VsWherePath -latest -property displayName

        Write-Output "Latest VS is: $VsInstance"

        # copy MDP file to msbuild location
        $VsPath = & $VSWherePath -latest -property installationPath

        Write-Debug "Copy MDP DLL to msbuild location"

        $msbuildPath = $VsPath + "\MSBuild"

        $extensionPath = $msbuildPath + "\nanoFramework\v1.0"

        Copy-Item -Path "$env:Pipeline_Workspace\mdp\*" -Destination $extensionPath -Force -Verbose
