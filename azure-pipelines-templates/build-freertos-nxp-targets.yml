parameters:
  - name: repoDirectory
    type: string
    default: $(Build.SourcesDirectory)

steps:
  - template: setup-cmake-user-presets.yml
    parameters:
      repoDirectory: ${{ parameters.repoDirectory }}

  - task: CMake@1
    inputs:
      cmakeArgs: "--preset $(CMakePreset) -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_VERSION=$(FIRMWARE_VERSION) -DNANOCLR_VERSION=$(NANOCLR_VERSION) -DNANOBOOTER_VERSION=$(NANOBOOTER_VERSION) -DTARGET_NAME=$(TargetPublishName) -DTOOL_SRECORD_PREFIX=$(SRECORD_PATH)/srecord/ $(BuildOptions)"
      workingDirectory: ${{ parameters.repoDirectory }}
    displayName: Setup build with CMake

  - task: CMake@1
    inputs:
      cmakeArgs: "--build --preset $(CMakePreset) --target all --config MinSizeRel"
      workingDirectory: ${{ parameters.repoDirectory }}
    displayName: Build with CMake
